<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webcam WebSocket Stream</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
      }
      video,
      img {
        border: 2px solid #333;
        border-radius: 8px;
        width: 640px;
        height: 480px;
        background-color: black;
        margin-bottom: 10px;
      }
      h1 {
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Webcam WebSocket Stream</h1>
    <video id="video" autoplay muted></video>
    <img id="annotated" alt="Annotated Frame" />

    <script>
      const ws = new WebSocket("ws://127.0.0.1:8000/api/v1/ws/attendance");
      const video = document.getElementById("video");
      const annotatedImg = document.getElementById("annotated");
      const canvas = document.createElement("canvas");

      ws.onopen = () => {
        console.log("WebSocket connected");
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.status === "frame" && data.image) {
          // Update annotated image
          annotatedImg.src = "data:image/jpeg;base64," + data.image;
        } else if (data.status === "matched") {
          console.log("Face matched:", data.userId, "Score:", data.score);
        } else if (data.status === "unmatched") {
          console.log("No match found");
        } else if (data.status === "no_face") {
          console.log("No face detected in frame");
        }
      };

      ws.onerror = (error) => {
        console.error("WebSocket error:", error);
      };

      ws.onclose = () => {
        console.log("WebSocket closed");
      };

      // Capture webcam frames and send to server
      navigator.mediaDevices
        .getUserMedia({ video: true })
        .then((stream) => {
          video.srcObject = stream;

          setInterval(() => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg");

            if (ws.readyState === WebSocket.OPEN) {
              ws.send(dataUrl);
            }
          }, 200); // send frame every 200ms
        })
        .catch((err) => {
          console.error("Error accessing webcam:", err);
        });
    </script>
  </body>
</html>
